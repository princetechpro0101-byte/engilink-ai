  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; line-height: 1.5; }

    /* Top Marketplace Navigation Bar (Amazon-Inspired) */
    .navbar { background: #131921; color: #ffffff; padding: 12px 4%; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 900; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-badge { background: #2563eb; color: #ffffff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }

    /* Search Bar */
    .search-form { flex: 1; min-width: 260px; max-width: 620px; display: flex; border-radius: 8px; overflow: hidden; background: #ffffff; border: 2px solid transparent; }
    .search-form:focus-within { border-color: #f59e0b; }
    .search-form select { background: #e2e8f0; border: none; padding: 10px 12px; font-size: 13px; color: #334155; font-weight: 600; outline: none; cursor: pointer; }
    .search-form input { flex: 1; border: none; padding: 10px 14px; font-size: 14px; color: #0f172a; outline: none; }
    .search-form button { background: #f59e0b; border: none; padding: 0 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .search-form button:hover { background: #d97706; }

    /* Account & Action Links */
    .nav-actions { display: flex; align-items: center; gap: 14px; }
    .nav-link { background: none; border: 1px solid #334155; color: #f8fafc; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .nav-link:hover { border-color: #ffffff; }
    .nav-cta { background: #2563eb; border: none; color: #ffffff; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .nav-cta:hover { background: #1d4ed8; }

    /* Sub-Navigation Category Strip */
    .subnav { background: #232f3e; padding: 8px 4%; display: flex; gap: 18px; overflow-x: auto; font-size: 13px; }
    .subnav a { color: #e2e8f0; text-decoration: none; white-space: nowrap; padding: 4px 8px; border-radius: 4px; font-weight: 500; }
    .subnav a:hover, .subnav a.active { background: #374151; color: #ffffff; font-weight: 700; }

    /* Trust Banner */
    .trust-bar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 14px 4%; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #334155; }
    .trust-item { display: flex; align-items: center; gap: 8px; font-weight: 600; }

    /* Hero Banner */
    .hero { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #ffffff; padding: 48px 5%; text-align: center; }
    .hero h1 { font-size: 34px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
    .hero p { font-size: 16px; color: #cbd5e1; max-width: 680px; margin: 0 auto 24px; }
    .hero-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn-amber { background: #f59e0b; color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; }
    .btn-amber:hover { background: #d97706; }
    .btn-outline-light { background: rgba(255,255,255,0.1); color: #ffffff; border: 1px solid rgba(255,255,255,0.3); padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-outline-light:hover { background: rgba(255,255,255,0.2); }

    /* Main Marketplace Container */
    .container { max-width: 1240px; margin: 30px auto; padding: 0 4%; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .section-header h2 { font-size: 21px; font-weight: 800; color: #0f172a; }

    /* Product/Specialist Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 20px; margin-bottom: 45px; }
    .card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08); }
    .profile-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #2563eb; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; flex-shrink: 0; border: 2px solid #e2e8f0; }
    .verified-badge { display: inline-flex; align-items: center; gap: 4px; background: #dcfce7; color: #166534; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-top: 3px; }
    .card h3 { font-size: 17px; font-weight: 700; color: #0f172a; }
    .role-label { font-size: 13px; color: #2563eb; font-weight: 600; margin-bottom: 6px; }
    .meta-row { font-size: 13px; color: #475569; margin-bottom: 12px; }
    .skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .skill-pill { background: #f1f5f9; color: #334155; font-size: 12px; padding: 3px 9px; border-radius: 5px; border: 1px solid #e2e8f0; font-weight: 500; }
    .card-bottom { border-top: 1px solid #e2e8f0; padding-top: 14px; display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 18px; font-weight: 800; color: #0f172a; }
    .price span { font-size: 12px; font-weight: 500; color: #64748b; }
    .btn-hire { background: #f59e0b; color: #0f172a; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; }
    .btn-hire:hover { background: #d97706; }

    .clip-preview { width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; margin: 10px 0; background: #0f172a; }
    .empty-state { background: #ffffff; border: 1px dashed #94a3b8; border-radius: 10px; padding: 32px; text-align: center; color: #475569; margin-bottom: 40px; }

    /* Modals */
    .modal-overlay { display: none; pointer-events: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 9999; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; }
    .modal-overlay.active { display: flex; pointer-events: auto; }
    .modal-card { background: #ffffff; width: 100%; max-width: 460px; border-radius: 12px; padding: 24px; box-shadow: 0 20px 25px rgba(0,0,0,0.25); margin-bottom: 30px; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .modal-top h3 { font-size: 19px; font-weight: 800; }
    .close-x { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #1e293b; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }

    /* Authentic Corporate Footer */
    footer { background: #131921; color: #cbd5e1; padding: 40px 5% 25px; margin-top: 60px; font-size: 13px; }
    .footer-grid { max-width: 1200px; margin: 0 auto 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
    .footer-col h4 { color: #ffffff; font-size: 15px; margin-bottom: 10px; }
    .footer-col p, .footer-col a { color: #94a3b8; text-decoration: none; display: block; margin-bottom: 6px; }
    .footer-col a:hover { color: #ffffff; text-decoration: underline; }
    .footer-bottom { border-top: 1px solid #232f3e; padding-top: 20px; text-align: center; color: #94a3b8; }
  </style>
  <script>
    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }
    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('active');
    }
  </script>
