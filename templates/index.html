<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Prince Omukama Noel">
<meta name="description" content="EngiLink AI — Verified Global Engineering Marketplace connecting clients with vetted mechanical, electrical, software, and civil engineers.">

<title>EngiLink AI — Verified Global Engineering Marketplace</title>
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "EngiLink AI",
    "url": "https://engi-link-pro.onrender.com",
    "author": {
    "@type": "Person",
    "name": "Prince Omukama Noel",
    "alternateName": "Prince Tech Pro 0101",
    "sameAs": [
        "https://github.com/princetechpro0101-byte"
      ]
    }
  }
</script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; line-height: 1.5; }

    /* Top Marketplace Bar */
    .navbar { background: #131921; color: #ffffff; padding: 12px 4%; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; z-index: 900; }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #ffffff; font-size: 22px; font-weight: 800; }
    .brand-badge { background: #2563eb; color: #ffffff; font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }

    /* Search Bar */
    .search-form { flex: 1; min-width: 250px; max-width: 600px; display: flex; border-radius: 8px; overflow: hidden; background: #ffffff; }
    .search-form select { background: #e2e8f0; border: none; padding: 10px; font-size: 13px; color: #334155; font-weight: 600; outline: none; }
    .search-form input { flex: 1; border: none; padding: 10px 12px; font-size: 14px; color: #0f172a; outline: none; }
    .search-form button { background: #f59e0b; border: none; padding: 0 16px; cursor: pointer; font-weight: 700; color: #0f172a; }

    /* Nav Actions */
    .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nav-link { background: none; border: 1px solid #475569; color: #f8fafc; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .nav-cta { background: #2563eb; border: none; color: #ffffff; padding: 9px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* Category Tabs */
    .subnav { background: #232f3e; padding: 8px 4%; display: flex; gap: 14px; overflow-x: auto; font-size: 13px; }
    .subnav a { color: #e2e8f0; text-decoration: none; white-space: nowrap; padding: 4px 10px; border-radius: 4px; }
    .subnav a:hover, .subnav a.active { background: #374151; color: #ffffff; font-weight: 700; }

    /* Trust Strip */
    .trust-bar { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 12px 4%; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #334155; font-weight: 600; }

    /* Hero */
    .hero { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #ffffff; padding: 48px 5%; text-align: center; }
    .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
    .hero p { font-size: 16px; color: #cbd5e1; max-width: 680px; margin: 0 auto 24px; }
    .hero-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn-amber { background: #f59e0b; color: #0f172a; border: none; padding: 12px 22px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; }
    .btn-outline-light { background: rgba(255,255,255,0.12); color: #ffffff; border: 1px solid rgba(255,255,255,0.35); padding: 12px 22px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }

    /* Sections & Cards */
    .container { max-width: 1200px; margin: 30px auto; padding: 0 4%; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .section-header h2 { font-size: 20px; font-weight: 800; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .profile-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #2563eb; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; flex-shrink: 0; }
    .verified-badge { display: inline-block; background: #dcfce7; color: #166534; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-top: 2px; }
    .role-label { font-size: 13px; color: #2563eb; font-weight: 700; margin-bottom: 6px; }
    .meta-row { font-size: 13px; color: #475569; margin-bottom: 10px; }
    .skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .skill-pill { background: #f1f5f9; color: #334155; font-size: 12px; padding: 3px 8px; border-radius: 5px; border: 1px solid #e2e8f0; }
    .card-bottom { border-top: 1px solid #e2e8f0; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 17px; font-weight: 800; color: #0f172a; }
    .price span { font-size: 12px; font-weight: 500; color: #64748b; }
    .btn-hire { background: #f59e0b; color: #0f172a; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; }
    .clip-preview { width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; margin: 10px 0; background: #0f172a; }
    .empty-state { background: #ffffff; border: 1px dashed #94a3b8; border-radius: 10px; padding: 30px; text-align: center; color: #475569; margin-bottom: 40px; }

    /* Modals */
    .modal-overlay { display: none; pointer-events: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78); z-index: 9999; align-items: flex-start; justify-content: center; padding: 28px 16px; overflow-y: auto; }
    .modal-overlay.active { display: flex; pointer-events: auto; }
    .modal-card { background: #ffffff; width: 100%; max-width: 460px; border-radius: 12px; padding: 24px; box-shadow: 0 20px 25px rgba(0,0,0,0.25); margin-bottom: 30px; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .close-x { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #1e293b; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }

    /* Footer */
    footer { background: #131921; color: #cbd5e1; padding: 36px 5% 24px; margin-top: 50px; font-size: 13px; }
    .footer-grid { max-width: 1200px; margin: 0 auto 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
    .footer-col h4 { color: #ffffff; font-size: 15px; margin-bottom: 8px; }
    .footer-col p, .footer-col a { color: #94a3b8; text-decoration: none; display: block; margin-bottom: 6px; }
    .footer-bottom { border-top: 1px solid #232f3e; padding-top: 18px; text-align: center; color: #94a3b8; }
</style>
<script>
    function openModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
    }
    function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
    }
</script>
</head>
<body>

<header class="navbar">
    <a href="/" class="brand">EngiLink <span class="brand-badge">Verified</span></a>

    <form class="search-form" action="/" method="GET">
    <select name="category">
        <option value="All" {% if category_filter == 'All' %}selected{% endif %}>All Disciplines</option>
        <option value="Electrical & Renewable Energy" {% if category_filter == 'Electrical & Renewable Energy' %}selected{% endif %}>Electrical</option>
        <option value="Mechanical & Robotics" {% if category_filter == 'Mechanical & Robotics' %}selected{% endif %}>Mechanical</option>
        <option value="AI & Software Engineering" {% if category_filter == 'AI & Software Engineering' %}selected{% endif %}>Software &amp; AI</option>
        <option value="Civil & Structural Engineering" {% if category_filter == 'Civil & Structural Engineering' %}selected{% endif %}>Civil &amp; Structural</option>
    </select>
    <input type="text" name="q" value="{{ search_query }}" placeholder="Search engineers by skill, city, or specialty...">
    <button type="submit">Search</button>
    </form>

    <div class="nav-actions">
    {% if user_name %}
        <span style="font-size: 13px; color: #cbd5e1;">Hello, <strong>{{ user_name }}</strong></span>
        <a href="/logout" class="nav-link">Sign Out</a>
    {% else %}
        <button type="button" onclick="openModal('authModal')" class="nav-link">Sign In / Account</button>
    {% endif %}
    <button type="button" onclick="openModal('engineerModal')" class="nav-cta">Join as Engineer</button>
    </div>
</header>

<nav class="subnav">
    <a href="/?category=All" class="{% if category_filter == 'All' %}active{% endif %}">All Specialists</a>
